# Lanes plan. Spec: https://github.com/shaurya6321/Lanes/blob/main/docs/PLAN_FORMAT.md
# Rules:
#   - Every file a task writes must match one of its `owns` globs.
#   - A contract is changed only by its owner; each change notifies higher-rank tasks that use it.
#   - Lower rank = upstream. Notices flow 1 -> 2 -> 3, never back. Merge in rank order.
feature: my-feature
updated: $today
owner: $member              # plan owner: their ownership edits notify affected tasks
members:
  - id: $member
    email: $email
  - id: teammate            # replace with your teammate's id (they set LANES_USER=teammate)
    email: teammate@example.com
hub_files:                  # shared files with exactly one owner
  - path: package.json
    owner: $member
  - path: pyproject.toml      # Lanes is a dev dependency in repo-only installs
    owner: $member
  - path: uv.lock
    owner: $member
  # Files created by `lanes init`. Whoever runs init owns them; change this if you like.
  - path: CLAUDE.md
    owner: $member
  - path: AGENTS.md
    owner: $member
  - path: .claude/**
    owner: $member
  - path: .gitignore
    owner: $member
  - path: .gitattributes
    owner: $member
contracts:
  - id: example-api
    file: .lanes/contracts/example-api.md
    owner: $member
tasks:
  - id: T1
    title: Example API + types
    rank: 1
    owner: $member
    owns: ["src/api/**", "src/types/**"]
    implements: [example-api]
    depends_on: []
    status: in_progress
  - id: T2
    title: Example UI
    rank: 2
    owner: teammate
    owns: ["src/ui/**"]
    uses: [example-api]
    depends_on: [T1]
    status: todo
