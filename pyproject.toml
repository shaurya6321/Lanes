[project]
name = "lanes"
version = "0.2.0"
description = "Shared plan, separate lanes: coordinate 2-6 people each running a coding agent on the same repo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shaurya Gupta" }]
dependencies = ["PyYAML>=6.0"]

[project.scripts]
lanes = "lanes.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lanes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
